# Insurance for the scrape chain (docs/RUNBOOK.md section 2): if no scrape run is queued
# or in progress and the newest one started more than 40 minutes ago, dispatch one.
# GitHub's cron fires this only every few hours for this repository, which is enough
# to restart a chain that died (a runner failure, a cancelled job).
name: heartbeat

on:
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - shell: bash
        run: |
          active=$(gh run list --workflow scrape.yml --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list --workflow scrape.yml --status queued --json databaseId --jq 'length')
          newest=$(gh run list --workflow scrape.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          age=999999
          if [ -n "$newest" ]; then age=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) )); fi
          echo "in_progress=$active queued=$queued newest=$newest age=${age}s"
          if [ "${active:-0}" = "0" ] && [ "${queued:-0}" = "0" ] && [ "$age" -gt 2400 ]; then
            gh workflow run scrape.yml && echo "chain restarted"
          else
            echo "chain alive; nothing to do"
          fi
