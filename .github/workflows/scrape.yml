# One enrollment snapshot every 30 minutes, appended to the `data` branch.
# See docs/DESIGN_A2.md section 8. Only this workflow writes to `data`.
name: scrape

on:
  schedule:
    - cron: "7,37 * * * *"   # off :00/:30, where GitHub delays or drops scheduled runs
    # Schedule re-registered 2026-09-19T09:20Z: no cron run fired in the three slots after
    # the workflow was re-enabled at 07:41Z; GitHub registers schedules on a push to this file.
  workflow_dispatch:
    inputs:
      term:
        description: 'Term name, e.g. "Spring 2027" (default: SCRAPE_TERM repo variable, else Spring 2027)'
        required: false
        type: string
      source:
        description: Data source
        required: false
        type: choice
        default: auto
        options:
          - auto
          - sis_api
          - classes_site
          - berkeleytime
      force_baseline:
        description: Write a baseline even if one exists today
        required: false
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # the chain step dispatches the next run

env:
  PYTHONUNBUFFERED: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 29 min = 1740 s. The fetch's --time-budget-s clock starts only after the
    # two checkouts, setup-python and pip (about 60-120 s), and the budget only
    # stops *scheduling*: a request already in flight may still spend one
    # 20 s socket timeout finishing (retries stop at the deadline). Budget
    # 1200 s + ~120 s setup + ~20 s overrun + parquet write, commit and
    # 3 push attempts (~60 s) is about 1400 s, leaving 5+ minutes of slack so
    # the job never hits this timeout with data fetched but nothing committed.
    # 29 min covered checkout, install, a 1,380 s fetch and the push; the chain step at the
    # end can sleep up to 30 min more waiting for the next :07/:37 slot.
    timeout-minutes: 59
    env:
      # Scheduled runs take the term from the SCRAPE_TERM repository variable
      # (Settings > Secrets and variables > Actions > Variables); Fall 2026 until Oct 4.
      TERM_NAME: ${{ inputs.term || vars.SCRAPE_TERM || 'Spring 2027' }}
      SOURCE: ${{ inputs.source || 'auto' }}
      FORCE_BASELINE: ${{ inputs.force_baseline == true && 'true' || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Verify the data branch exists
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "::error::Branch 'data' does not exist on origin. Create it once with scripts/bootstrap_data_branch.sh (from a clean checkout of main), then re-run this workflow."
            exit 1
          fi

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch snapshot
        shell: bash
        env:
          # Empty when the secrets are not set; --source auto then uses classes_site.
          SIS_CLASS_APP_ID: ${{ secrets.SIS_CLASS_APP_ID }}
          SIS_CLASS_APP_KEY: ${{ secrets.SIS_CLASS_APP_KEY }}
        run: |
          # --time-budget-s is passed explicitly so the 29-minute arithmetic
          # above does not depend on the CLI default in scraper/config.py.
          args=(--term "$TERM_NAME" --source "$SOURCE" --data-root data-branch --time-budget-s 1380 --n-shards 12)
          if [ "$FORCE_BASELINE" = "true" ]; then
            args+=(--force-baseline)
          fi
          echo "python -m scraper.fetch ${args[*]}"
          # `shell: bash` runs with -o pipefail, so the fetch exit code survives the tee.
          # Exit 2 (zero sections observed) and 3 (term not published) both fail the job
          # so they show up in the Actions history; nothing is committed in either case.
          python -m scraper.fetch "${args[@]}" 2>&1 | tee fetch.log

      - name: Commit and push snapshot
        shell: bash
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          read -r kind scope < <(python -c "import json; s = json.load(open('status.json')); print(s['kind'], s['scope'])")
          msg="snapshot ${TERM_NAME} ${kind} ${scope} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git commit --quiet -m "$msg"
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then
              echo "pushed: $msg"
              exit 0
            fi
            echo "push failed (attempt $attempt of 3); rebasing on origin/data"
            # -X theirs keeps this run's status.json when the previous push rewrote it.
            git pull --rebase -X theirs origin data
          done
          echo "::error::could not push to the data branch after 3 attempts"
          exit 1

      - name: Show how far the run got
        # always(): also runs when the job was cancelled by timeout-minutes,
        # so the log tail and the uncommitted files are visible in the run.
        if: always()
        shell: bash
        run: |
          echo "--- tail -n 5 fetch.log"
          tail -n 5 fetch.log 2>/dev/null || echo "(no fetch.log)"
          echo "--- git -C data-branch status --short"
          git -C data-branch status --short 2>/dev/null || echo "(no data-branch checkout)"

      - name: Upload run log
        # always() rather than failure(): a job cancelled by timeout-minutes
        # is neither success nor failure, and its log is the one we most need.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: fetch.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the 30-minute chain alive
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          # GitHub's cron fired this workflow only every 2 to 4 hours during its first
          # day (docs/DATA_LOG.md, 2026-09-19). Runs started with GITHUB_TOKEN through
          # workflow_dispatch do create new runs, so each run dispatches its successor at
          # the next :07 or :37 mark unless another run is already queued or running.
          # The dispatch carries no inputs: the successor resolves the term from the
          # SCRAPE_TERM variable and the source from the secrets, like a scheduled run.
          m=$((10#$(date -u +%M))); s=$((10#$(date -u +%S)))
          if [ $m -lt 7 ]; then wait=$(( (7 - m) * 60 - s ))
          elif [ $m -lt 37 ]; then wait=$(( (37 - m) * 60 - s ))
          else wait=$(( (67 - m) * 60 - s )); fi
          [ $wait -lt 0 ] && wait=0
          echo "sleeping ${wait}s until the next slot"
          sleep $wait
          others=$(gh run list --workflow scrape.yml --status in_progress --json databaseId --jq "map(select(.databaseId != ${THIS_RUN})) | length")
          queued=$(gh run list --workflow scrape.yml --status queued --json databaseId --jq 'length')
          if [ "${others:-0}" != "0" ] || [ "${queued:-0}" != "0" ]; then
            echo "another run exists (in_progress=$others queued=$queued); not dispatching"
            exit 0
          fi
          gh workflow run scrape.yml && echo "dispatched the next run"
          # once a day (the first slot after 15:00 UTC) also run the gap monitor, so
          # alerting does not depend on GitHub's cron either
          if [ "$(date -u +%H)" = "15" ] && [ "$(date -u +%M)" -lt 30 ]; then
            gh workflow run monitor.yml && echo "dispatched the daily monitor"
          fi
