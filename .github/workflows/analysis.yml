# Weekly: rebuild flows, models, figures and the site JSON from the data branch and
# commit the outputs to main (which redeploys the site). See docs/DESIGN_A5.md section 6.
name: analysis

on:
  schedule:
    - cron: "23 15 * * 0"   # Sundays 15:23 UTC
  workflow_dispatch:
    inputs:
      term:
        description: 'Term name (default: SCRAPE_TERM repo variable)'
        required: false
        type: string

permissions:
  contents: write
  actions: write   # to redeploy the site after committing (pushes made with GITHUB_TOKEN do not trigger pages.yml)

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TERM_NAME: ${{ inputs.term || vars.SCRAPE_TERM || 'Spring 2027' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve the SIS term id
        id: term
        shell: bash
        run: |
          TERM_ID=$(python -c "from scraper.sources.base import TermSpec; print(TermSpec.from_name('$TERM_NAME').sis_term_id)")
          echo "term_id=$TERM_ID" >> "$GITHUB_OUTPUT"
          echo "term $TERM_NAME -> $TERM_ID"
      - name: Run the analysis
        shell: bash
        run: |
          python -m analysis.run --data-root data-branch --term-id "${{ steps.term.outputs.term_id }}" --out analysis/out --site-dir analysis/out/site_candidate 2>&1 | tee analysis.log
      # site/data may hold the Fall 2026 backfill (data_source berkeleytime_history) until this
      # project's own Spring 2027 snapshots have clearings; an own-data run with no clearings
      # must not replace it with an empty cohort. Only the Spring 2027 term (2272) may replace it:
      # the Fall 2026 test term was collected after its last automatic waitlist run (Sep 11), and by
      # 2026-09-23 its own-data cohort showed 209 post-deadline clearings (docs/DATA_LOG.md).
      - name: Publish site data only when the own snapshots have clearings
        shell: bash
        run: |
          EVENTS=$(python -c "import json; print(json.load(open('analysis/out/site_candidate/meta.json'))['events'])")
          echo "own-data cohort clearings: $EVENTS"
          if [ "$EVENTS" -ge 10 ] && [ "${{ steps.term.outputs.term_id }}" = "2272" ]; then
            rm -rf site/data && cp -r analysis/out/site_candidate site/data
            echo "site/data replaced with the own-data estimates"
          else
            echo "keeping the published site/data (own-data estimates replace it only for term 2272 with 10 or more clearings; published: $(python -c "import json; m=json.load(open('site/data/meta.json')); print(m.get('data_source'), m.get('term_name'), m.get('events'), 'clearings')" 2>/dev/null || echo 'none published'))"
          fi
      - name: Commit outputs
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp "analysis/out/${{ steps.term.outputs.term_id }}/report.md" "reports/report_${{ steps.term.outputs.term_id }}.md"
          if ls "analysis/out/${{ steps.term.outputs.term_id }}/figures/"*.png >/dev/null 2>&1; then
            mkdir -p "reports/figures_${{ steps.term.outputs.term_id }}"
            cp "analysis/out/${{ steps.term.outputs.term_id }}/figures/"*.png "reports/figures_${{ steps.term.outputs.term_id }}/"
          fi
          git add site/data reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "analysis: $TERM_NAME $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ steps.term.outputs.term_id }}-${{ github.run_id }}
          path: |
            analysis.log
            analysis/out
          retention-days: 30
          if-no-files-found: ignore
